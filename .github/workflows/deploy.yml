name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build -- --base=/lexa-lepexa/
        env:
          # Current Deploy-F backend. This is intentionally kept in the workflow
          # so the Pages build does not depend on a repository Actions variable.
          VITE_API_MODE: live
          VITE_API_URL: https://a49782-3772.q-d-f.pw/api/v1
          VITE_TILES: openfreemap

      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Smoke check of the build
        run: |
          test -f dist/index.html
          grep -q '/lexa-lepexa/assets/' dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
