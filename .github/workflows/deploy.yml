name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [frontend]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Router basename for project Pages
        run: |
          sed -i 's#createBrowserRouter(appRoutes)#createBrowserRouter(appRoutes, { basename: import.meta.env.BASE_URL })#' src/main.tsx

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build -- --base=/lexa-lepexa/
        env:
          VITE_API_MODE: live
          # Адрес API — переменная репозитория API_URL (Settings → Secrets and variables → Variables).
          # Бэкенд должен разрешать CORS для https://team-shpilit.github.io (переменная CORS_ORIGINS).
          VITE_API_URL: ${{ vars.API_URL || 'https://a49734-6295.q.d-f.pw/api/v1' }}
          VITE_TILES: openfreemap

      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
