name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      # Сайт на своём домене (Settings → Pages → Custom domain = marshrutypobedy.ru), поэтому base=/.
      # Вернуться на team-shpilit.github.io/lexa-lepexa/ — переменная репозитория SITE_BASE=/lexa-lepexa/ .
      - name: Build
        run: npm run build -- --base=${{ vars.SITE_BASE || '/' }}
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL || 'https://marshrutypobedy.ru' }}
          # Живой бэкенд — только когда задана переменная репозитория API_URL
          # (Settings → Secrets and variables → Actions → Variables). Без неё — демо-данные в браузере:
          # бесплатный туннель меняет адрес и падает, а жюри не должно увидеть пустой сайт.
          # Сайт на своём домене https://marshrutypobedy.ru (Settings → Pages → Custom domain), поэтому base=/.
          # Бэкенд должен разрешать CORS для https://marshrutypobedy.ru (переменная CORS_ORIGINS).
          VITE_API_MODE: ${{ vars.API_URL && 'live' || 'mock' }}
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_TILES: openfreemap

      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Smoke check of the build
        run: |
          test -f dist/index.html
          grep -q '"${{ vars.SITE_BASE || '/' }}assets/' dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
